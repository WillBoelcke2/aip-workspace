<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIP Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
/* AI Pathology Design System v1.0, leitura minimalista em fundo branco.
   Ink define, Mint é tempero (foco, confirmação, hoje), o resto é neutro. Régua de 4 px.
   Layout: barra lateral com a árvore de páginas + uma área de trabalho (documento ou base de dados). */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --bg-2:#FFFFFF; --paper:#FAFBFC; --hover:#F5F6F8; --active:#EFF0F2;
  --line:#ECEEF1; --line-2:#C8CCD2;
  --text:#14161C; --text-2:#3A3F48; --muted:#6B7280; --faint:#A0A6AE;
  --mint:#1EFFA3; --emerald:#1ADB8C; --mist:#CCFFFE; --ok:#0E8F5B;
  --warning:#FFB547; --danger:#FF5470; --info:#4D8BFF;
  --display:"Funnel Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r-s:8px; --pill:999px;
  --shadow:0 16px 48px rgba(20,22,28,.12),0 2px 6px rgba(20,22,28,.05),0 0 0 1px var(--line);
  --glow:0 0 0 3px rgba(30,255,163,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select{font:inherit;color:inherit}
a{color:inherit}
::selection{background:rgba(30,255,163,.28)}
:focus-visible{outline:2px solid var(--mint);outline-offset:1px;border-radius:4px}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

#app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}

/* ---------- barra lateral ---------- */
#side{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ws{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.ws-mark{width:28px;height:28px;border-radius:7px;background:var(--mint);color:var(--bg);display:grid;place-items:center;font:700 12px var(--display);letter-spacing:.02em}
.ws-name{font:600 15px var(--display);line-height:1.2}
.ws-sub{font-size:11.5px;color:var(--muted)}
.side-actions{padding:0 8px 8px;display:grid;gap:2px}
.srow{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:var(--r-s);color:var(--text-2);font-size:14px;min-height:30px}
.srow:hover{background:var(--hover);color:var(--text)}
.srow kbd{margin-left:auto;font:11px var(--mono);color:var(--faint);border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.tree-wrap{flex:1;overflow:auto;padding:4px 8px 12px;min-height:0}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 8px 6px;display:flex;align-items:center;justify-content:space-between}
.sec button{color:var(--muted);padding:2px;border-radius:4px}.sec button:hover{color:var(--text);background:var(--hover)}
.node{display:flex;align-items:center;gap:4px;border-radius:var(--r-s);padding:2px 4px 2px calc(4px + var(--d,0)*14px);min-height:30px;color:var(--text-2);position:relative}
.node:hover{background:var(--hover)}
.node.on{background:var(--active);color:var(--text)}
.node.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:2px;background:var(--mint);border-radius:2px}
.node .tw{width:20px;height:20px;display:grid;place-items:center;color:var(--faint);border-radius:4px;flex:none}
.node .tw:hover{background:var(--active);color:var(--text)}
.node .tw svg{transition:transform .12s}
.node .tw.open svg{transform:rotate(90deg)}
.node a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-decoration:none;padding:3px 0;font-size:14px}
.node a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .acts{display:none;gap:2px}
.node:hover .acts,.node:focus-within .acts{display:flex}
.node .acts button{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.node .acts button:hover{background:var(--active);color:var(--text)}
.none{color:var(--faint);font-size:13px;padding:4px 8px}
.side-foot{border-top:1px solid var(--line);padding:8px}

.chip-ic{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font:600 11px var(--display);flex:none;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 80%,white)}
.chip-ic svg{width:13px;height:13px}
.c-mint{--c:#DDF9EC;--ct:#0E8F5B}.c-mist{--c:#CCFFFE;--ct:#14161C}.c-yellow{--c:#FFF1D9;--ct:#96600A}.c-orange{--c:#FFE7D8;--ct:#B14A16}.c-pink{--c:#FFE1E7;--ct:#C22848}.c-purple{--c:#E1EAFF;--ct:#2D5BC9}.c-gray{--c:#EFF0F2;--ct:#3A3F48}

/* ---------- área principal ---------- */
#work{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;
  background:radial-gradient(900px 420px at 100% -10%,rgba(30,255,163,.07),transparent 60%),var(--bg)}
#top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);min-height:50px}
#menu-btn{display:none;width:32px;height:32px;place-items:center;border-radius:var(--r-s)}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font-size:13.5px;color:var(--muted);overflow:hidden;white-space:nowrap}
.crumbs a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.crumbs a:hover{color:var(--text)}
.crumbs a:last-child{color:var(--text)}
.crumbs i{color:var(--faint);font-style:normal}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.ok::before{background:var(--mint);box-shadow:0 0 8px rgba(30,255,163,.7)}
.status.busy::before{background:var(--warning)}
.status.bad::before{background:var(--danger)}
.tbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r-s);color:var(--muted)}
.tbtn:hover{background:var(--hover);color:var(--text)}
.tbtn.on{color:var(--warning)}.tbtn.on svg{fill:currentColor}
#main{flex:1;overflow:auto;min-height:0}

.doc{max-width:780px;margin:0 auto;padding:56px 56px 30vh}
.title{font:600 40px/1.15 var(--display);letter-spacing:-.01em;margin:0 0 6px;outline:none;text-wrap:balance;word-break:break-word}
.title:empty::before,.ce:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.meta{color:var(--faint);font-size:12.5px;margin-bottom:22px}

/* propriedades de um item */
.props{display:grid;gap:2px;margin:14px 0 22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.prow{display:grid;grid-template-columns:170px minmax(0,1fr);align-items:center;min-height:34px;gap:8px}
.pname{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pval{min-width:0}

/* ---------- editor de blocos ---------- */
.editor{margin-left:-28px}
.blk{display:flex;align-items:flex-start;position:relative;padding:2px 0 2px calc(28px + var(--ind,0)*24px)}
.blk.hid{display:none}
.blk .grip{position:absolute;left:calc(4px + var(--ind,0)*24px);top:5px;width:20px;height:22px;display:grid;place-items:center;border-radius:4px;color:var(--faint);opacity:0;cursor:grab}
.blk:hover .grip,.blk .grip:focus-visible{opacity:1}
.blk .grip:hover{background:var(--hover);color:var(--text)}
.blk.drop-a::after,.blk.drop-b::after{content:"";position:absolute;left:28px;right:0;height:2px;background:var(--mint);border-radius:2px}
.blk.drop-b::after{top:-1px}.blk.drop-a::after{bottom:-1px}
.blk.dragging{opacity:.35}
.ce{flex:1;min-width:0;outline:none;padding:3px 2px;white-space:pre-wrap;word-break:break-word;caret-color:var(--mint)}
.ce code{font:13px var(--mono);background:var(--active);padding:1px 5px;border-radius:4px;color:var(--mist)}
.ce a{color:var(--mint);text-underline-offset:3px}
.mk{width:24px;flex:none;display:grid;place-items:center;height:29px;color:var(--muted)}
.t-h1 .ce{font:600 28px/1.25 var(--display);padding-top:18px}
.t-h2 .ce{font:600 22px/1.3 var(--display);padding-top:14px}
.t-h3 .ce{font:600 17px/1.35 var(--display);padding-top:10px}
.t-h1 .grip{top:24px}.t-h2 .grip{top:18px}.t-h3 .grip{top:12px}
.t-ol .mk{font-variant-numeric:tabular-nums;font-size:14px;justify-content:end;padding-right:6px}
.t-ul .mk::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--text-2)}
.t-todo .mk button{width:16px;height:16px;border:1.5px solid var(--faint);border-radius:4px;display:grid;place-items:center}
.t-todo.done .mk button{background:var(--mint);border-color:var(--mint);color:var(--bg)}
.t-todo .mk svg{width:12px;height:12px;stroke-width:2.4;opacity:0}
.t-todo.done .mk svg{opacity:1}
.t-todo.done .ce{color:var(--faint);text-decoration:line-through}
.t-toggle .mk button{width:20px;height:20px;display:grid;place-items:center;border-radius:4px}
.t-toggle .mk button:hover{background:var(--hover)}
.t-toggle .mk svg{transition:transform .12s}
.t-toggle.open .mk svg{transform:rotate(90deg)}
.t-quote .ce{border-left:2px solid var(--mist);padding-left:14px;color:var(--text-2);font-size:16px}
.t-callout .ce{background:var(--hover);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.t-code .ce{font:13px/1.6 var(--mono);background:#0F1116;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--mist);tab-size:2}
.t-hr hr{flex:1;border:0;border-top:1px solid var(--line-2);margin:13px 0}
.pagelink{flex:1;display:flex;align-items:center;gap:10px;padding:5px 8px;margin-left:-6px;border-radius:var(--r-s);text-decoration:none;font-weight:500}
.pagelink:hover{background:var(--hover)}
.pagelink u{text-decoration-color:var(--line-2);text-underline-offset:4px}
.pagelink.gone{color:var(--faint);font-weight:400}
.tail{height:120px;cursor:text}

/* ---------- menus e popovers ---------- */
#pops{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{position:fixed;pointer-events:auto;background:var(--hover);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px;max-width:min(340px,calc(100vw - 16px));max-height:min(420px,calc(100vh - 16px));overflow:auto;font-size:14px}
.pop h6{margin:6px 8px 4px;font:400 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:var(--r-s);min-height:32px}
.mi:hover,.mi.sel{background:var(--active)}
.mi small{color:var(--faint);margin-left:auto;font-size:12px}
.mi.danger{color:#FF6B9E}
.mi .ck{margin-left:auto;color:var(--mint)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.field{display:grid;gap:4px;padding:6px 8px}
.field label{font-size:12px;color:var(--muted)}
.inp{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-s);padding:6px 9px;width:100%;min-height:32px}
.inp:focus{outline:none;border-color:var(--mint)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.frow{display:grid;grid-template-columns:1fr 1fr 28px;gap:6px;padding:4px 8px;align-items:center}

.tag{display:inline-flex;align-items:center;max-width:100%;padding:1px 8px;border-radius:5px;font-size:12.5px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 78%,white)}
.tags{display:flex;flex-wrap:wrap;gap:4px}

/* ---------- base de dados ---------- */
.dbpage{padding:44px 40px 120px;max-width:1280px;margin:0 auto}
.tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;padding:8px 10px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-color:var(--mint)}
.tools{display:flex;align-items:center;gap:6px;padding:10px 0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:var(--r-s);color:var(--text-2);font-size:13.5px;min-height:30px;white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--text)}
.btn.act{color:var(--mint)}
.btn.pri{background:var(--mint);color:var(--bg);font-weight:600}
.btn.pri:hover{background:var(--emerald);color:var(--bg)}
.btn.line{border:1px solid var(--line-2)}
.q{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);border:1px solid var(--line);border-radius:var(--r-s);padding:0 8px;min-height:30px}
.q input{background:none;border:0;outline:none;width:150px;font-size:13.5px}
.scroll-x{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;font-size:14px}
.grid th{font-weight:400;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.grid th button{display:flex;align-items:center;gap:7px;width:100%;padding:8px 10px;font-size:13px}
.grid th button:hover{background:var(--hover);color:var(--text)}
.grid td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:0;height:38px;min-width:140px;vertical-align:middle}
.grid td:first-child,.grid th:first-child{border-left:0;min-width:260px}
.grid tr:hover td{background:rgba(255,255,255,.015)}
.cell{width:100%;min-height:37px;padding:6px 10px;background:none;border:0;display:flex;align-items:center}
input.cell:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--mint)}
input.cell.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=date].cell{color:var(--text-2)}
.tcell{display:flex;align-items:center}
.tcell input{font-weight:500}
.open-btn{opacity:0;margin-right:6px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:2px 7px;white-space:nowrap}
tr:hover .open-btn,.open-btn:focus-visible{opacity:1}
.open-btn:hover{color:var(--mint);border-color:var(--mint)}
.cb{width:16px;height:16px;accent-color:var(--mint);margin:0 10px}
.foot{color:var(--faint);font-size:12.5px;padding:10px 2px;display:flex;gap:16px;align-items:center}
.addrow{color:var(--muted);padding:8px 10px;width:100%;display:flex;gap:8px;align-items:center;font-size:14px}
.addrow:hover{background:var(--hover);color:var(--text)}
.hint{color:var(--muted);padding:28px 4px;display:grid;gap:12px;justify-items:start;max-width:520px}

.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:16px}
.col{flex:0 0 272px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:8px}
.col.over{border-color:var(--mint)}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px}
.col-h b{font-weight:400;color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums}
.card{background:var(--hover);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;cursor:grab;width:100%}
.card:hover{border-color:var(--line-2)}
.card strong{font-weight:500;word-break:break-word}
.card .empty{color:var(--faint)}
.lst{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:8px 8px;border-bottom:1px solid var(--line);width:100%}
.li:hover{background:var(--hover)}
.li strong{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-h{display:flex;align-items:center;gap:8px;padding:4px 0 10px}
.cal-h h3{font:600 18px var(--display);margin:0 8px 0 0;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dow{padding:6px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);background:var(--bg-2)}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:grid;gap:4px;align-content:start;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{background:rgba(0,0,0,.18)}.day.out .dn{color:var(--faint)}
.dn{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;height:20px}
.day.today .dn span{background:var(--mint);color:var(--bg);border-radius:10px;padding:0 6px;font-weight:600}
.dn button{opacity:0;color:var(--muted);width:20px;height:20px;display:grid;place-items:center;border-radius:4px}
.day:hover .dn button,.dn button:focus-visible{opacity:1}
.dn button:hover{background:var(--hover);color:var(--mint)}
.ev{background:var(--hover);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.ev:hover{border-color:var(--mint)}

/* ---------- painel lateral do item ---------- */
#peek{position:absolute;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg-2);border-left:1px solid var(--line-2);box-shadow:-24px 0 60px rgba(0,0,0,.45);z-index:20;display:flex;flex-direction:column}
.peek-h{display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line)}
.peek-b{flex:1;overflow:auto}
#peek .doc{padding:32px 40px 30vh}
#peek .title{font-size:30px}

/* ---------- busca ---------- */
#search{position:fixed;inset:0;background:rgba(8,9,12,.6);z-index:60;display:grid;place-items:start center;padding:12vh 16px 0}
.sbox{width:min(600px,100%);background:var(--hover);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sbox header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.sbox input{flex:1;background:none;border:0;outline:none;font-size:16px}
.sres{max-height:50vh;overflow:auto;padding:6px}
.sres .mi{display:grid;grid-template-columns:20px minmax(0,1fr);gap:2px 10px}
.sres .mi em{grid-column:2;font-style:normal;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres .mi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.center{height:100%;display:grid;place-items:center;padding:24px}
.blank{display:grid;gap:14px;justify-items:start;max-width:440px}
.blank h2{font:600 26px/1.2 var(--display);margin:0;text-wrap:balance}
.blank p{color:var(--muted);margin:0}
.blank div{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--active);border:1px solid var(--line-2);border-radius:var(--r);padding:9px 14px;font-size:13.5px;z-index:70;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.ro .grip,.ro .acts,.ro .addrow,.ro .tail,.ro [data-w]{display:none!important}

@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .18s}
  #app.nav #side{transform:none;box-shadow:24px 0 60px rgba(0,0,0,.5)}
  #menu-btn{display:grid}
  .doc{padding:32px 20px 30vh}.title{font-size:30px}
  .dbpage{padding:28px 16px 100px}
  #peek .doc{padding:24px 20px 30vh}
  .status span{display:none}
  .prow{grid-template-columns:120px minmax(0,1fr)}
}

/* ---------- tema claro minimalista ---------- */
body{font-size:16px;line-height:1.6}
::selection{background:rgba(30,255,163,.4)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#work{background:var(--bg)}
#side{border-right:1px solid var(--line)}
#top{border-bottom:0;padding:12px 24px}
.ws{padding:20px 20px 16px;display:block}
.logo{height:21px;width:auto;display:block;color:var(--text)}
.ws-sub{margin-top:8px;font-size:12px;color:var(--faint)}
.side-actions{padding:0 12px 8px}.tree-wrap{padding:4px 12px 12px}.side-foot{border-top:0;padding:12px}
.srow,.node{color:var(--text-2)}
.srow:hover,.node:hover{background:var(--hover);color:var(--text)}
.srow kbd{border-color:var(--line);color:var(--faint)}
.sec{color:var(--faint);padding:20px 8px 8px}
.node.on{background:var(--active);color:var(--text)}.node.on a{font-weight:600}.node.on::before{display:none}
.node .tw,.node .acts button{color:var(--faint)}
.chip-ic{background:none;color:var(--muted);border:1px solid var(--line-2);font:600 10px var(--body);border-radius:5px}
.chip-ic svg{width:12px;height:12px}
.crumbs,.status{color:var(--muted)}.crumbs i{color:var(--line-2)}
.status::before{background:var(--line-2)}
.status.ok::before{background:var(--emerald);box-shadow:none}.status.busy::before{background:var(--warning)}.status.bad::before{background:var(--danger)}
.tbtn{color:var(--muted)}.tbtn:hover{background:var(--hover);color:var(--text)}.tbtn.on{color:var(--text)}
.doc{max-width:760px;padding:64px 56px 30vh}
.title{font-weight:700;font-size:44px;line-height:1.1;letter-spacing:-.025em;margin-bottom:16px}
.t-h1 .ce{font-weight:700;font-size:30px;letter-spacing:-.02em;padding-top:24px}
.t-h2 .ce{font-weight:600;font-size:23px;letter-spacing:-.015em;padding-top:20px}
.t-h3 .ce{font-weight:600;font-size:18px;padding-top:12px}
.t-h1 .grip{top:30px}.t-h2 .grip{top:24px}.t-h3 .grip{top:14px}
.ce{caret-color:var(--text)}
.ce code{background:var(--active);color:var(--text);border-radius:4px}
.ce a{color:var(--text);text-decoration-color:var(--line-2)}
.mk{height:32px}.blk .grip{top:7px;color:var(--faint)}
.t-ul .mk::before{background:var(--text)}
.t-todo .mk button{border-color:var(--line-2);border-radius:5px}
.t-todo.done .mk button{background:var(--mint);border-color:var(--mint);color:var(--text)}
.t-todo.done .ce{color:var(--faint)}
.t-quote .ce{border-left:2px solid var(--text);color:var(--text-2)}
.t-callout .ce{background:var(--mist);border:0;border-radius:var(--r);padding:16px 20px}
.t-code .ce{background:var(--paper);border:1px solid var(--line);color:var(--text);padding:16px 20px}
.t-hr hr{border-top-color:var(--line)}
.blk.drop-a::after,.blk.drop-b::after{background:var(--emerald)}
.pagelink{font-weight:500}.pagelink u{text-decoration:none}.pagelink:hover{background:var(--hover)}
.pop{background:var(--bg);border-radius:var(--r);padding:8px}
.pop h6,.dow{color:var(--faint)}
.mi:hover,.mi.sel{background:var(--hover)}
.mi.danger{color:#D12C4F}.mi .ck{color:var(--text)}
.inp{background:var(--bg);border-color:var(--line-2);border-radius:var(--r-s)}
.inp:focus{border-color:var(--text);box-shadow:var(--glow)}
.tag{background:var(--c);color:var(--ct);border-radius:var(--pill);padding:1px 10px;font-weight:500}
.dbpage{padding:56px 48px 120px}
.tabs{border-bottom-color:var(--line);margin-top:8px}
.tab{color:var(--muted);padding:8px 12px}.tab.on{color:var(--text);border-color:var(--text);font-weight:600}
.tools{padding:12px 0}
.btn{border-radius:var(--pill);color:var(--text-2);padding:4px 12px;min-height:32px}
.btn:hover{background:var(--hover);color:var(--text)}
.btn.act{color:var(--ok);font-weight:600}
.btn.pri{background:var(--text);color:#fff;font:600 14px var(--display);padding:4px 16px}
.btn.pri:hover{background:var(--text-2);color:#fff}
.btn.line{border-color:var(--line-2)}
.q{border-color:var(--line);border-radius:var(--pill);padding:0 12px;min-height:32px;color:var(--faint)}
.q:focus-within{border-color:var(--text);box-shadow:var(--glow)}
.grid th button{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px}
.grid th button:hover{background:var(--hover)}
.grid td{border-left:0;height:44px}
.grid tr:hover td{background:var(--paper)}
.cell{padding:8px 12px;min-height:43px}
input.cell:focus{box-shadow:inset 0 0 0 1.5px var(--text)}
input[type=date].cell{color:var(--text-2)}
input[type=date].nodate{color:transparent}
input[type=date].nodate:hover,input[type=date].nodate:focus{color:var(--faint)}
input[type=date]::-webkit-calendar-picker-indicator{opacity:0;cursor:pointer}
input[type=date]:hover::-webkit-calendar-picker-indicator,input[type=date]:focus::-webkit-calendar-picker-indicator{opacity:.45}
.open-btn{border-color:var(--line-2);border-radius:var(--pill);color:var(--muted);margin-right:8px}
.open-btn:hover{color:var(--text);border-color:var(--text)}
.cb{accent-color:var(--text);margin:0 12px}
.foot{color:var(--faint)}.addrow{color:var(--muted);border-radius:var(--r-s);padding:8px 12px}.addrow:hover{background:var(--hover)}
.board{gap:16px}
.col{background:var(--paper);border:1px solid transparent;border-radius:16px;padding:12px}
.col.over{border-color:var(--text)}
.col-h b{color:var(--faint)}
.card{background:var(--bg);border-color:var(--line);box-shadow:0 1px 2px rgba(20,22,28,.04);padding:12px 16px}
.card:hover{border-color:var(--line-2)}
.li{border-bottom-color:var(--line);padding:12px 8px}.li:hover{background:var(--paper)}
.cal{border-color:var(--line);border-radius:var(--r)}
.cal .dow{background:var(--bg);border-bottom-color:var(--line)}
.day{border-color:var(--line)}.day.out{background:var(--paper)}.day.out .dn{color:var(--faint)}
.dn{color:var(--muted)}
.day.today .dn span{background:var(--mint);color:var(--text)}
.dn button:hover{background:var(--active);color:var(--text)}
.ev{background:var(--bg);border-color:var(--line-2);border-radius:var(--r-s)}.ev:hover{border-color:var(--text)}
#peek{background:var(--bg);border-left:1px solid var(--line);box-shadow:-24px 0 64px rgba(20,22,28,.08)}
.peek-h{border-bottom:0;padding:12px 16px}
.props{border-bottom-color:var(--line)}.pname{color:var(--muted)}
#search{background:rgba(20,22,28,.32)}
.sbox{background:var(--bg);border-radius:20px}.sbox header{border-bottom-color:var(--line);padding:16px 20px;color:var(--faint)}
.sres{padding:8px}
.blank h2{font-weight:700;font-size:32px;letter-spacing:-.02em}
#toast{background:var(--text);color:#fff;border:0;border-radius:var(--pill);padding:10px 20px;box-shadow:0 16px 48px rgba(20,22,28,.2)}
.title:empty::before,.ce:empty::before{color:var(--line-2)}
@media (max-width:820px){
  #app.nav #side{box-shadow:24px 0 64px rgba(20,22,28,.14)}
  .doc{padding:32px 20px 30vh}.title{font-size:32px}.dbpage{padding:28px 16px 100px}
}
#gate{position:fixed;inset:0;background:var(--bg);z-index:80;display:grid;place-items:center;padding:24px}
.gate-box{display:grid;gap:16px;justify-items:start;max-width:420px}
.gate-box .logo{height:28px;margin-bottom:24px}
.gate-box h1{font:700 40px/1.1 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.gate-box p{margin:0;color:var(--muted)}
.gate-box .btn.pri{font-size:16px;padding:12px 28px;margin-top:8px}
.gate-err{color:#C22848!important}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--mist);color:var(--text);display:grid;place-items:center;font:600 10px var(--body);flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  const t=document.createElement("template");t.innerHTML=html||"";
  (function walk(n){[...n.childNodes].forEach(c=>{
    if(c.nodeType===3)return; if(c.nodeType!==1||DROP[c.tagName.toUpperCase()]){c.remove();return;}
    walk(c);
    if(!TAGS[c.tagName]){c.replaceWith(...c.childNodes);return;}
    [...c.attributes].forEach(a=>{if(!(c.tagName==="A"&&a.name==="href"&&/^https?:\/\//i.test(a.value)))c.removeAttribute(a.name);});
    if(c.tagName==="A"){c.setAttribute("target","_blank");c.setAttribute("rel","noopener noreferrer");}
  });})(t.content);
  const out=t.innerHTML;return out==="<br>"?"":out;
}
const plain=html=>{const t=document.createElement("template");t.innerHTML=html||"";return t.content.textContent||"";};
let toastT;function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4200);}

const timers=new Map(),chains=new Map(),dirty=new Set(),raw=new WeakMap();
const COLORS=["mint","mist","yellow","orange","pink","purple","gray"];
const page=id=>S.pages.get(id);
const kids=id=>[...S.pages.values()].filter(p=>(p.parent||null)===(id||null)&&!p.trashed).sort((a,b)=>(a.order||0)-(b.order||0));
const isRow=p=>!!(p&&p.parent&&page(p.parent)?.kind==="db");
function alive(p){let n=p,i=0;while(n&&i++<40){if(n.trashed)return false;if(!n.parent)return true;n=page(n.parent);}return false;}
function path(p){const out=[];let n=p,i=0;while(n&&i++<40){out.unshift(n);n=n.parent?page(n.parent):null;}return out;}

function save(p){p.ts=Date.now();p.sid=S.sid;if(me)p.by=me.email;S.pages.set(p.id,p);queue(p.id);}
function queue(id,now){dirty.add(id);status();clearTimeout(timers.get(id));timers.set(id,setTimeout(()=>flush(id),now?0:650));}
function flush(id){
  timers.delete(id);
  const p=page(id),data=p?JSON.parse(JSON.stringify(p)):null;
  const next=(chains.get(id)||Promise.resolve()).then(()=>persist(id,data)).catch(writeErr).then(()=>{
    if(chains.get(id)===next){chains.delete(id);if(!timers.has(id))dirty.delete(id);}status();});
  chains.set(id,next);
}
async function persist(id,data){
  const ref=db.doc("pages/"+id);if(data)await ref.set(data);else await ref.delete();
}
function writeErr(e){
  const c=e&&e.code;
  if(c==="permission-denied"){S.err="Sem permissão para salvar";toast("O banco recusou a gravação. Confira se as regras do Firestore foram publicadas e se a conta é do domínio da empresa.");}
  else if(c==="resource-exhausted"){S.err="Limite do plano atingido";toast("O limite diário do plano do Firebase foi atingido. As gravações voltam a funcionar amanhã ou após mudar de plano.");}
  else if(c==="unauthenticated"){S.err="Sessão encerrada";toast("Sua sessão terminou. Recarregue a página e entre de novo.");}
  else{S.err="Falha ao salvar";toast("Não foi possível salvar a última alteração. Verifique a conexão e edite de novo para tentar outra vez.");}
}
function drop(id){S.pages.delete(id);queue(id,true);}
function purge(id){kids(id).concat([...S.pages.values()].filter(p=>p.parent===id&&p.trashed)).forEach(c=>purge(c.id));drop(id);}

function onSnap(snap){
  clearTimeout(loadT);S.slow=false;
  const seen=new Set(),changed=new Set();
  snap.docs.forEach(d=>{
    seen.add(d.id);if(dirty.has(d.id))return;
    const data=JSON.parse(JSON.stringify(d.data()||{}));data.id=d.id;
    const old=page(d.id),str=JSON.stringify(data);
    if(old){if(raw.get(old)===str)return;if(data.sid===S.sid&&data.ts===old.ts){raw.set(old,str);return;}}
    raw.set(data,str);S.pages.set(d.id,data);changed.add(d.id);
  });
  if(!snap.metadata.fromCache)[...S.pages.keys()].forEach(id=>{if(!seen.has(id)&&!dirty.has(id)){S.pages.delete(id);changed.add(id);}});
  if(S.mode==="loading"){S.mode="cloud";start();}
  else if(changed.size)remote(changed);
  status();
}
function remote(changed){
  if(!page(S.cur)||!alive(page(S.cur)))return route();
  renderSide();
  const cur=page(S.cur);
  const hit=id=>changed.has(id)||[...changed].some(c=>page(c)?.parent===id);
  const a=document.activeElement,ce=a&&a.closest&&a.closest(".ce"),bid=ce&&ce.closest(".blk")?.dataset.id,off=ce?caretOff(ce):0,inPeek=ce&&!!ce.closest("#peek");
  if(!cur||hit(S.cur)||(cur.parent&&changed.has(cur.parent)))renderMain(true);
  if(S.peek&&(changed.has(S.peek)||changed.has(page(S.peek)?.parent)))drawPeek();
  if(bid){const n=$((inPeek?"#peek ":"#main ")+`.blk[data-id="${bid}"] .ce`);if(n)setCaret(n,off);}
}

/* ============ criação ============ */
function dbDefaults(){const st=rid();return{
  schema:{props:[{id:"title",name:"Nome",type:"title"},{id:st,name:"Status",type:"status",options:[
    {id:rid(),name:"A fazer",color:"gray"},{id:rid(),name:"Em andamento",color:"yellow"},{id:rid(),name:"Concluído",color:"mint"}]}]},
  views:[{id:rid(),name:"Tabela",type:"table"},{id:rid(),name:"Quadro",type:"board",group:st}]};}
function newPage(parent,kind,title){

  const p={id:rid(),kind:kind||"page",title:title||"",parent:parent||null,order:(sib.at(-1)?.order||0)+1,color:COLORS[Math.floor(Math.random()*6)],blocks:[]};
  if(kind==="db")Object.assign(p,dbDefaults());

function trash(id){const p=page(id);if(!p)return;p.trashed=true;save(p);if(S.peek===id){S.peek=null;}
  if(S.cur===id||!alive(page(S.cur)||{trashed:true})){const first=kids(null)[0];go(first?first.id:null);}else{renderAll();}
  toast("Movido para a lixeira");}

function go(id){const h=id?"p-"+id:"";if(location.hash.slice(1)===h){route();}else location.hash=h;}

function status(){

  if(S.err){c="bad";t=S.err;}
  else if(S.mode==="loading"){c="busy";t=S.slow?"Sem resposta do servidor ainda":"Conectando…";}
  else if(S.ro){t="Somente leitura";}
  else if(dirty.size){c="busy";t="Salvando…";}
  else if(S.mode==="cloud"){c="ok";t="Salvo e compartilhado";}

}
